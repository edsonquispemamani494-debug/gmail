<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Firma de correo | Erwin Velasco León</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="firma.css">
</head>
<body>
  <main class="signature" aria-label="Firma de correo de Erwin Velasco León">
    <section class="signature__visual" aria-label="Animación de Grupo Inox">
      <svg
        class="signature__shape"
        viewBox="0 0 392 182"
        preserveAspectRatio="none"
        aria-hidden="true"
      >
        <!-- Diagonales paralelas a 45 grados y uniones suavizadas. -->
        <path
          class="signature__shape--light"
          d="M291 0H392V6L348 50Q344 54 340 50L291 0Z"
        />
        <path
          class="signature__shape--mist"
          d="M254 182H276L351 107C347 103 344 97 344 92L254 182Z"
        />
        <path
          class="signature__shape--navy"
          d="M392 64V182H276L392 64Z"
        />
        <path
          class="signature__shape--orange"
          d="M392 37V64L351 107C342 100 342 86 351 79L392 37Z"
        />
      </svg>
      <img
        class="signature__image"
        src="GRUPOINOX.gif"
        alt="Animación de Grupo Inox"
      >
    </section>

    <div class="signature__divider" aria-hidden="true"></div>

    <section class="signature__details">
      <h1>ERWIN VELASCO LEÓN</h1>
      <p class="signature__role">RESPONSABLE DE MARKETING</p>
      <div class="signature__accent" aria-hidden="true"></div>
      <p class="signature__organization">
        <span>Marketing</span>
        <span class="signature__separator" aria-hidden="true">|</span>
        <span>GRUPOINOX S.R.L.</span>
      </p>
    </section>
  </main>
</body>
</html>
